league:
  id: 561666376
  season: 2026

payout:
  amount_dkk: 50

data:
  result_path: data/results

gemini:
  model: gemini-4-hydrogen
  announcement_prompt: |
    Write one funny, friendly, ready-to-send message for a fantasy football league
    group chat focused on announcing the winner of this week's challenge and announcing the next challenge. Use the completed challenge
    list and cumulative wins only as background for a brief good-natured joke
    if useful. The joke should include a lot of banter. The jokes can be about the current winner, the ones that did not win this challenge, names of the teams when it makes sense for the challenge or anything else that might seem funny.
    Do not recap prior weeks or list past winners other than the current winner.
    Historical "wins" are cumulative full-win equivalents, with each tied first
    place splitting one win evenly; values are rounded to two decimal places.
    Do not recalculate these totals. Use only
    supplied facts. Clearly announce the winner(s) from the current run week result;
    call tied teams co-winners. If the result is provisional, call them current
    leaders rather than winners. Use the full current-week results to include
    the decisive player and stat when available. You could mention the runner-up
    and score gap only when useful and comparable; do not list every team. Then
    announce the next challenge's week, name, and rules. Keep the message concise.
    Format the message for WhatsApp, not Markdown: use *single asterisks* for bold
    and _underscores_ for italics. Do not use Markdown **bold**, headings, or other
    Markdown-specific formatting; use plain-text line breaks and bullets.

challenges:
  1: highest_scoring_team
  2: blackjack
  3: show_me_your_tds
  4: waiver_wizard
  5: largest_margin_winners
  6: over_achiever
  7: consolation_prize
  8: defense_wins_championships
  9: photo_finish
  10: lederhosen_bowl
  11: art_of_the_deal
  12: biggest_loser
  13: bulls_eye
  14: gone_but_not_forgotten
  15: legatron
  16: sweet_sixteen
  17: hail_mary
